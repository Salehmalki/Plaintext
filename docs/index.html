<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>القسمة المطولة خطوة بخطوة</title>
    <meta name="description" content="تطبيق تعليمي تفاعلي لشرح خطوات القسمة المطولة بالتفصيل (اقسم، اضرب، اطرح، أنزل) مع الاستلاف والتحقق ودعم الأرقام العربية والإنجليزية." />
    <meta property="og:title" content="القسمة المطولة خطوة بخطوة" />
    <meta property="og:description" content="تطبيق تعليمي تفاعلي لشرح خطوات القسمة المطولة بالتفصيل (اقسم، اضرب، اطرح، أنزل) مع الاستلاف والتحقق ودعم الأرقام العربية والإنجليزية." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6fbff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101a26" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('division_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.backgroundColor = '#101a26';
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.backgroundColor = '#f6fbff';
          }
        } catch (e) {}
      })();
    </script>
    <style>:root{color:#1c3a7a;background-color:#f6fbff}:root[data-theme=dark]{color:#d3e2ff;background-color:#101a26}@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color:#d3e2ff;background-color:#101a26}}html,body{background-color:inherit;min-height:100vh;margin:0}</style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <script type="module" crossorigin src="./assets/app.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
  </head>
  <body class="font-cairo">
    <div id="root"></div>
  </body>
</html>
